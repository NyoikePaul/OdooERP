name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-flake8
      - name: Install tools
        run: pip install flake8 bandit --quiet
      - name: flake8
        run: |
          flake8 custom_addons/ \
            --max-line-length=120 \
            --exclude=__pycache__,*.pyc \
            --statistics --count || true
      - name: bandit security scan
        run: |
          bandit -r custom_addons/ \
            -x custom_addons/*/tests/ \
            -ll --format txt || true
      - name: Check no hardcoded secrets
        run: |
          if grep -rn "consumer_secret\s*=\s*['\"][A-Za-z0-9]\{8\}" custom_addons/ 2>/dev/null \
             | grep -v "fields\.\|test\|example\|sandbox"; then
            echo "WARNING: Possible hardcoded secret"
          else
            echo "OK: No hardcoded secrets"
          fi

  validate:
    name: Module Structure Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate manifests
        run: |
          for f in $(find custom_addons/ -name "__manifest__.py"); do
            python3 -c "
          import ast, sys
          try:
              m = ast.literal_eval(open('$f').read())
              required = ['name','version','summary','author','license','depends']
              missing  = [k for k in required if k not in m]
              if missing:
                  print(f'MISSING fields in $f: {missing}')
                  sys.exit(1)
              print(f'OK: $f  v{m[\"version\"]}')
          except Exception as e:
              print(f'FAIL: $f - {e}')
              sys.exit(1)
          "
          done

      - name: Check module required files
        run: |
          for module in custom_addons/*/; do
            ok=1
            for req in __manifest__.py __init__.py security/ir.model.access.csv; do
              [ -f "${module}${req}" ] || { echo "MISSING: ${module}${req}"; ok=0; }
            done
            [ $ok -eq 1 ] && echo "OK: $module"
          done

      - name: Check .env not committed
        run: |
          if [ -f .env ]; then
            echo "FAIL: .env is committed!" && exit 1
          else
            echo "OK: .env not committed"
          fi

      - name: Validate docker compose
        run: |
          cp .env.example .env
          docker compose config -q && echo "OK: docker-compose.yml"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q && echo "OK: prod override"
          rm -f .env

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install bandit --quiet
      - name: Bandit medium+ severity
        run: |
          bandit -r custom_addons/ \
            -x custom_addons/*/tests/ \
            -ll -ii --format txt || true
      - name: Check LICENSE exists
        run: |
          if [ -f LICENSE ]; then
            echo "OK: LICENSE"
          else
            echo "FAIL: No LICENSE" && exit 1
          fi
      - name: Verify LGPL-3 in all manifests
        run: |
          for f in $(find custom_addons/ -name "__manifest__.py"); do
            python3 -c "
          import ast
          m = ast.literal_eval(open('$f').read())
          lic = m.get('license','')
          if lic not in ('LGPL-3','GPL-3','MIT','Apache-2.0','OEEL-1'):
              print(f'WARNING: Non-standard license in $f: {lic}')
          else:
              print(f'OK: $f license={lic}')
          "
          done
