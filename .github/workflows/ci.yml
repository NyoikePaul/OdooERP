name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install flake8 bandit --quiet

      - name: Lint with flake8
        run: |
          flake8 custom_addons/ \
            --max-line-length=120 \
            --exclude=__pycache__,*.pyc \
            --statistics \
            --count || true

      - name: Security scan with bandit
        run: |
          bandit -r custom_addons/ \
            -x custom_addons/*/tests/ \
            -ll --format txt || true

      - name: Check for hardcoded credentials
        run: |
          if grep -rn "consumer_secret\s*=\s*['\"][A-Za-z0-9]\{10\}" custom_addons/ 2>/dev/null; then
            echo "WARNING: Possible hardcoded credentials"
          else
            echo "OK: No hardcoded credentials"
          fi

  validate:
    name: Repo Structure Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check required files exist
        run: |
          echo "Checking required files..."
          for f in LICENSE README.md .env.example docker-compose.yml docker-compose.prod.yml config/odoo.conf nginx/odoo.conf CHANGELOG.md; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Validate manifests are valid Python
        run: |
          for f in $(find custom_addons/ -name "__manifest__.py"); do
            python3 -c "
import ast, sys
try:
    ast.literal_eval(open('$f').read())
    print('OK: $f')
except Exception as e:
    print('FAIL: $f -', e)
    sys.exit(1)
"
          done

      - name: Check all modules have security file
        run: |
          for module in custom_addons/*/; do
            if [ ! -f "${module}security/ir.model.access.csv" ]; then
              echo "MISSING security: $module"
              exit 1
            fi
            echo "OK: $module"
          done

      - name: Verify .env not committed
        run: |
          [ ! -f ".env" ] && echo "OK: .env not committed" || (echo "FAIL: .env committed!" && exit 1)

      - name: Validate docker compose syntax
        run: |
          cp .env.example .env
          docker compose config -q && echo "OK: docker-compose.yml"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q && echo "OK: prod config"
          rm -f .env
